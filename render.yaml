# Render Blueprint: static site built from this repo.
services:
  - type: web
    name: nclexbase
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      # The sign-in page keeps its two demo buttons (student, admin) at the owner's request,
      # so the site can be walked through without an account. They are one click into the
      # admin: set this to "0" before there is anything behind it worth protecting.
      - key: NEXT_PUBLIC_DEMO_AUTH
        value: "1"
    headers:
      # Keep the site out of search engines and AI crawlers (owner's decision).
      # Matches the cPanel docroot rule in deploy/htaccess-noindex.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
